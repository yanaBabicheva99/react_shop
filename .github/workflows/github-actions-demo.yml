name: Node.js CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:

    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [18.x]

    steps:
      - uses: actions/checkout@v2
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v1
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install dependencies
        run: npm install

      - name: Build
        run: npm run start:build

      - name: Run lint
        run: npm run lint:ts
        if: always()

      - name: Run lint scss
        run: npm run lint:scss
        if: always()

      - name: Run the tests
        run: npm run test:unit
        if: always()

      - name: Build storybook
        run: npm run storybook:build
        if: always()

      - name: Update storybook
        run: npx loki update --storiesFilter="^shared\\/Modal Modal Dark\$" --reactUri="file:./storybook-static"
        if: always()

      - name: Run the tests UI
        run: npm run test:ui:ci
        if: always()



